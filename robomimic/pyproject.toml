[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robomimic"
version = "0.5.0"
description = "robomimic: A Modular Framework for Robot Learning from Demonstration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.13.3",
    "h5py",
    "psutil",
    "tqdm",
    "termcolor",
    "tensorboard",
    "tensorboardX",
    "imageio",
    "imageio-ffmpeg",
    "matplotlib",
    "egl_probe>=1.0.1",
    "torch",
    "torchvision",
    "huggingface_hub==0.23.4",
    "transformers==4.41.2",
    "diffusers==0.11.1",
]

[tool.setuptools.packages.find]
include = ["robomimic*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.sh", "*.yaml"]
